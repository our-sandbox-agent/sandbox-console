<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151b17"><meta name="description" content="Sandbox — AI Agent 沙盒控制台互動原型"><title>Sandbox · Workspace</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"></head><body><div id="app"></div><div id="toast" role="status"></div><dialog id="create-dialog"><form id="create-form"><div class="section-head"><h2>New sandbox</h2><button type="button" class="icon-button" data-close aria-label="關閉">×</button></div><p>準備一個獨立工作空間，讓 Agent 接手。</p><label>Sandbox name<input name="name" required maxlength="40" pattern="[a-zA-Z0-9][a-zA-Z0-9_-]*" placeholder="my-next-experiment" autocomplete="off"></label><label>Agent<select name="agent"><option>Claude</option><option>Codex</option><option>Harness</option></select></label><label>Repository <small>(optional)</small><input name="repo" type="url" placeholder="https://github.com/org/repo" autocomplete="off"></label><label>Resources<select name="size"><option value="2">2 vCPU · 4 GB RAM</option><option value="4">4 vCPU · 8 GB RAM</option></select></label><div class="notice">此版本在瀏覽器內模擬，不會建立雲端資源或收費。</div><button class="primary wide" type="submit">Create sandbox <span>↗</span></button></form></dialog><script type="module" src="/src.js"></script></body></html>
