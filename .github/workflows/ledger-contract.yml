name: Verify ledger contract examples
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/contracts/ledger-examples.json'
      - 'scripts/verify-ledger-examples.py'
      - '.github/workflows/ledger-contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/contracts/ledger-examples.json'
      - 'scripts/verify-ledger-examples.py'
      - '.github/workflows/ledger-contract.yml'
permissions:
  contents: read
jobs:
  ledger-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-ledger-examples.py
